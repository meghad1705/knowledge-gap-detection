<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Tutor | Student Workspace</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="main-content tutor-page"><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span>student workspace</span></a></header>
<section class="welcome-row"><div><p class="eyebrow accent">AI TUTOR</p><h1>Ask anything.</h1><p class="muted">Get a hint, an example, or a new way to think about a difficult topic.</p></div></section>
<article class="panel tutor-panel"><div class="tutor-intro"><span class="tutor-spark">✦</span><div><strong>Learning tutor</strong><small>Patient, step-by-step help</small></div></div><div class="chat-log" id="chatLog"><div class="chat-bubble tutor-bubble">Hi Alex. What are you working through today?</div></div><div class="prompt-chips"><button data-prompt="Give me a hint for quadratic equations">Give me a hint</button><button data-prompt="Explain Newton's second law simply">Explain a concept</button><button data-prompt="Quiz me on arrays">Quiz me</button></div><p class="tutor-label">EXPLORE A SUBJECT</p><div class="prompt-chips subject-chips" id="tutorSubjects" aria-label="Tutor subjects"></div><form class="tutor-form" id="tutorForm"><input id="tutorInput" placeholder="Ask your tutor a question..." autocomplete="off"><button class="primary-button" type="submit">Send <span>↗</span></button></form></article>
</main><script src="../js/tutor.js"></script></body></html>
